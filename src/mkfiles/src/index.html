<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>MKFILES</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/tabulator-tables@4.9.3/dist/css/tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.9.3/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mkfiles_extendKeys.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/7.0.4/jsoneditor.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.3.7/viewer.css" rel="stylesheet">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body class="bg-light">

  <div class="app-shell d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
      <div class="container-fluid gap-3">
        <a class="navbar-brand fw-semibold text-uppercase" href="#">MKFILES</a>
        <div class="navbar-nav flex-wrap gap-1 me-lg-3">
          <a class="nav-link app-nav-link" id="quick-link-home" href="#">home</a>
          <a class="nav-link app-nav-link" id="quick-link-taskparams" href="#">taskparams</a>
          <a class="nav-link app-nav-link" id="quick-link-taskstorage" href="#">taskstorage</a>
          <a class="nav-link app-nav-link" id="quick-link-taskautomators" href="#">taskautomators</a>
          <a class="nav-link app-nav-link" id="quick-link-sceneparams" href="#">sceneparams</a>
          <a class="nav-link app-nav-link" id="quick-link-marmosets" href="#">marmosets</a>
          <a class="nav-link app-nav-link" id="quick-link-dailydata" href="#">dailydata</a>
        </div>
        <div class="form-check form-switch text-white ms-lg-auto mb-0">
          <input class="form-check-input" type="checkbox" role="switch" id="rfid-switch">
          <label class="form-check-label fw-semibold" for="rfid-switch" id="rfid-switch-span">RFID OFF</label>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 app-content">
      <div class="container-fluid py-3">
        <div class="row g-3">
          <div class="col-12">
            <div id="mkquery-card" class="card app-card shadow-sm">
              <div class="card-body">
                <form id="mkquery-form" class="mkquery-grid">
                  <select class="form-select selector" id="qry-loc-selector">
                    <option disabled selected>Query Location</option>
                    <optgroup label="Firestore/DB" id="firestore-optgroup">
                      <option value="marmosets">firestore/marmosets</option>
                      <option value="mkturkdata">firestore/mkturkdata</option>
                      <option value="mkdailydata">firestore/mkdailydata</option>
                      <option value="objects">firestore/objects</option>
                      <option value="devices">firestore/devices</option>
                      <option value="eyecalibrations">firestore/eyecalibrations</option>
                      <option value="mkscale">firestore/mkscale</option>
                      <option value="mturkhits">firestore/mturkhits</option>
                      <option value="mturkusers">firestore/mturkusers</option>
                      <option value="mturkdata">firestore/mturkdata</option>
                    </optgroup>
                    <optgroup label="Cloud Storage" id="storage-optgroup">
                      <option value="mkturkfiles">gcs/mkturkfiles</option>
                      <option value="mkturkfiles_mturk">gcs/mkturkfiles_mturk</option>
                    </optgroup>
                    <optgroup label="BigQuery" id="bigquery-optgroup"></optgroup>
                  </select>

                  <select class="form-select selector" id="field-selector">
                    <option disabled selected>Field Value</option>
                  </select>

                  <select class="form-select selector" id="quick-plot-x">
                    <option disabled selected>Quick Plot x-axis</option>
                  </select>

                  <select class="form-select selector" id="quick-plot-y">
                    <option disabled selected>Quick Plot y-axis</option>
                  </select>

                  <button type="button" class="btn btn-outline-primary" id="plot-btn">Quick Plot</button>
                  <button type="submit" class="btn btn-primary" id="go-btn">Go</button>
                  <input type="text" class="form-control keyword-input" id="keyword-input-0" placeholder="Keyword 1">
                  <input type="text" class="form-control keyword-input" id="keyword-input-1" placeholder="Keyword 2">
                  <input type="text" class="form-control keyword-input" id="keyword-input-2" placeholder="Keyword 3">
                </form>
              </div>
            </div>
          </div>

          <div class="col-12 col-xl-6 d-flex">
            <div id="finder-card" class="card app-card shadow-sm flex-grow-1">
              <div class="card-body d-flex flex-column gap-2">
                <div id="finder-div">
                  <div id="finder-controls">
                    <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center" id="back-btn" disabled aria-label="Back">
                      <i class="material-icons">keyboard_arrow_left</i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center" id="forward-btn" disabled aria-label="Forward">
                      <i class="material-icons">keyboard_arrow_right</i>
                    </button>
                    <input type="search" class="form-control keyword-input" id="filter-value" placeholder="search">
                    <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center" id="show-images-btn" disabled aria-label="Show images">
                      <i class="material-icons">slideshow</i>
                    </button>
                    <p id="num-image-slider-p" class="mb-0">
                      <input type="range" class="form-range" min="1" max="10" value="1" step="1" id="num-image-slider">
                    </p>
                    <p id="path-name-span" class="mb-0 text-truncate">Path:</p>
                  </div>
                  <div id="finder"></div>
                  <div id="finder-controls-2">
                    <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center" id="upload-file" aria-label="Upload">
                      <i class="material-icons">cloud_upload</i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center" id="download-file" aria-label="Download">
                      <i class="material-icons">cloud_download</i>
                    </button>
                  </div>
                </div>
                <div id="chart-div"></div>
              </div>
            </div>
          </div>

          <div class="col-12 col-xl-6 d-flex">
            <div id="media-card" class="card app-card shadow-sm flex-grow-1">
              <div class="card-body d-flex flex-column gap-3">
                <div id="editor-div" class="d-flex flex-column gap-3">
                  <form action="#" id="file-name-form" class="d-flex flex-wrap align-items-start gap-2">
                    <div class="flex-grow-1" id="file-name-div">
                      <input class="form-control" type="text" id="file-name-input" placeholder="Selected file">
                    </div>
                    <button type="button" class="btn btn-outline-primary" id="file-rename-btn">Rename</button>
                    <button type="button" class="btn btn-outline-primary" id="file-dup-btn">Duplicate</button>
                    <dialog class="modal-dialog modal-content border-0 shadow" id="file-dup-modal">
                      <div class="modal-header">
                        <h5 class="modal-title">Duplicate File</h5>
                      </div>
                      <div class="modal-body">
                        <div class="mb-3">
                          <input class="form-control" type="text" id="dup-file-name">
                        </div>
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-primary save" id="save-dup-file-btn">Save</button>
                        <button type="button" class="btn btn-secondary close" id="cancel-dup-file-btn">Cancel</button>
                      </div>
                    </dialog>
                    <dialog class="modal-dialog modal-content border-0 shadow" id="filename-modal">
                      <div class="modal-header">
                        <h5 class="modal-title"></h5>
                      </div>
                      <div class="modal-body">
                        <input class="form-control filename-input" type="text">
                      </div>
                      <div class="modal-footer">
                        <button type="button" class="btn btn-primary sv">Save</button>
                        <button type="button" class="btn btn-secondary cl">Close</button>
                      </div>
                    </dialog>
                  </form>

                  <div id="editor"></div>

                  <div id="button-box">
                    <button type="button" class="btn btn-primary" id="update-btn">UPDATE</button>
                    <button type="button" class="btn btn-outline-primary" id="active-btn">Make Active</button>
                    <button type="button" class="btn btn-outline-primary" id="store-param-btn">Store</button>
                    <button type="button" class="btn btn-outline-primary" id="render-btn">Render</button>
                    <div id="param-gen-btn-box" class="d-flex flex-wrap gap-2">
                      <button type="button" class="btn btn-outline-primary" id="generate-btn" value="generate">Vectorize Param</button>
                      <button type="button" class="btn btn-outline-primary" id="expand-btn" value="expand">Expand Param</button>
                    </div>
                    <button type="button" class="btn btn-outline-primary" id="save-scene-param-btn">Save Param</button>
                  </div>
                </div>

                <div id="image-canvas-div">
                  <ul id="image-canvas"></ul>
                </div>

                <div id="dat-gui-div">
                  <canvas id="three-canvas"></canvas>
                  <div id="dat-container"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="./mkfiles_rfid.js"></script>

</body>

</html>
