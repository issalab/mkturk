<!doctype html>
<!--
  survey_test.html

  Standalone harness that triggers ONLY the Prolific exit survey, skipping
  consent/calibration/the task itself entirely - for quickly reviewing/testing
  a survey's wording and layout without running actual trials.

  Not linked from anywhere in the real app; safe to leave in place (reads the
  same live survey config JSON from Storage as the real flow, writes its
  test-subject record to the same subject id used below, mkturk_survey_test,
  so it never collides with real participant data).
-->
<head>
	<meta charset="utf-8">
	<title>Survey Test Harness</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<script src="/__/firebase/8.2.3/firebase-app.js"></script>
	<script src="/__/firebase/8.2.3/firebase-auth.js"></script>
	<script src="/__/firebase/8.2.3/firebase-storage.js"></script>
	<script type="text/javascript">
		const firebaseConfig = {
			apiKey: "AIzaSyA0fbv2VqE-AfF6V_nxSSXCEqaTlBlZnTI",
			authDomain: "sandbox-ce2c5.firebaseapp.com",
			databaseURL: "https://sandbox-ce2c5.firebaseio.com",
			projectId: "sandbox-ce2c5",
			storageBucket: "sandbox-ce2c5.appspot.com",
			messagingSenderId: "1003719887944",
			appId: "1:1003719887944:web:931f6c3c7bf6bc0b719c7d"
		};
		firebase.initializeApp(firebaseConfig);
	</script>
</head>
<body style="background:#111; color:#eee; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
	<div style="max-width:480px; margin:40px auto; text-align:center;">
		<h5>Survey Test Harness</h5>
		<p style="font-size:13px; color:#999;">Pick which survey to load, then click Start. Submitting saves a test record under ProlificId "mkturk_survey_test" - never mixed with real participant data.</p>
		<select id="task_picker" class="form-select" style="margin-bottom:12px;">
			<option value="Prolific_samedifferent_20260930">Prolific_samedifferent_20260930 (5-question, elias/neptune)</option>
			<option value="">default_survey.json (original 5-question)</option>
		</select>
		<button class="btn btn-primary" id="start_btn">Start</button>
		<p id="status_line" style="font-size:12px; color:#7d8aa0; margin-top:16px;"></p>
	</div>

	<!-- Same overlay markup the real app uses - mkturk_survey.js populates
	     #survey_questions_container at runtime regardless of host page. -->
	<div id="survey_overlay" style="display:none; z-index: 502; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,10,10,0.97); color:white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; flex-direction: column; align-items:center; justify-content:center; padding: 20px;">
		<div style="max-width:480px; width:100%; text-align:left;">
			<p id="survey_title" style="text-align:center; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; color:#7d8aa0; margin-bottom:18px;">Before you finish, a few quick questions</p>
			<div id="survey_questions_container"></div>
			<button class="btn btn-primary" id="survey_submit" style="width:100%; padding:12px 0; border-radius:10px; font-weight:600;" disabled>SUBMIT</button>
		</div>
	</div>

	<script src="mkturk_survey.js"></script>
	<script src="mkturk_firebasestorage.js"></script>
	<script type="text/javascript">
		const storage = firebase.storage();
		const auth = firebase.auth();
		let ENV = {};
		let prolificUserConfig = {};

		document.getElementById('start_btn').addEventListener('click', async () => {
			document.getElementById('status_line').textContent = 'Signing in...';
			await auth.signInAnonymously();

			ENV = {
				ProlificId: 'mkturk_survey_test',
				StudyId: 'survey_test_harness',
				SessionId: 'session_' + Date.now(),
			};
			prolificUserConfig = { task: document.getElementById('task_picker').value };

			document.getElementById('status_line').textContent = 'Loading survey...';
			await prolificSurveyPromise();
			document.getElementById('status_line').textContent =
				'Submitted. Saved to mkturkfiles_prolific/userfiles/mkturk_survey_test/surveys/ - pick another and Start again to retest.';
		});
	</script>
</body>
